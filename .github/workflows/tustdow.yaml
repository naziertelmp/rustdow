      - name: Take Screenshot
        run: |
          Start-Sleep -Seconds 3
          
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bitmap = New-Object System.Drawing.Bitmap $screen.Bounds.Width, $screen.Bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.Bounds.X, $screen.Bounds.Y, 0, 0, $bitmap.Size)
          $bitmap.Save("C:\RustDesk\screenshot.png")
          $graphics.Dispose()
          $bitmap.Dispose()
          
          Write-Host "Screenshot saved!"

      - name: Upload Screenshot to ImgBB
        run: |
          $imgPath = "C:\RustDesk\screenshot.png"
          
          if (Test-Path $imgPath) {
              Write-Host "Uploading screenshot to ImgBB..."
              
              # تحويل الصورة إلى base64
              $imgBase64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($imgPath))
              
              # رفع لـ imgbb.com (بدون API key)
              $body = @{ image = $imgBase64 }
              $response = Invoke-RestMethod -Uri "https://imgbb.com/json" -Method Post -Body $body -ContentType "application/x-www-form-urlencoded"
              
              if ($response.url) {
                  Write-Host "========================================="
                  Write-Host "SCREENSHOT URL: $($response.url)"
                  Write-Host "========================================="
              } else {
                  Write-Host "Trying alternative upload..."
                  
                  # بديل: transfer.sh
                  $response = Invoke-RestMethod -Uri "https://transfer.sh" -Method Put -InFile $imgPath -ContentType "image/png"
                  Write-Host "========================================="
                  Write-Host "SCREENSHOT URL: $response"
                  Write-Host "========================================="
              }
          }
