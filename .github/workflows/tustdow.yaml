name: disercore RustDesk

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Create User
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "TOOLBOXLAP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"

      - name: Download RustDesk
        run: |
          New-Item -Path "C:\RustDesk" -ItemType Directory -Force
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.7/rustdesk-1.2.7-x86_64.exe" -OutFile "C:\RustDesk\rustdesk.exe"

      - name: Run RustDesk
        run: |
          Start-Process -FilePath "C:\RustDesk\rustdesk.exe" -WindowStyle Hidden
          Start-Sleep -Seconds 15

      - name: Get ID and Password
        run: |
          $logPath = "C:\Users\runneradmin\AppData\Roaming\RustDesk\log"
          Write-Host "========================================="
          
          $idLog = Get-ChildItem "$logPath\get-id\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $passLog = Get-ChildItem "$logPath\password\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          
          if ($idLog) { Write-Host "ID Log: $($idLog.FullName)"; Get-Content $idLog.FullName }
          if ($passLog) { Write-Host "Pass Log: $($passLog.FullName)"; Get-Content $passLog.FullName }
          
          Write-Host "========================================="
          Write-Host "Windows User: TOOLBOXLAP"
          Write-Host "Windows Password: admin@123"
          Write-Host "========================================="

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RustDesk Active"
              Start-Sleep -Seconds 300
          }
