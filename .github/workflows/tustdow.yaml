name: disercore RustDesk Screenshot

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Create User
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "TOOLBOXLAP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"

      - name: Download RustDesk
        run: |
          New-Item -Path "C:\RustDesk" -ItemType Directory -Force
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.7/rustdesk-1.2.7-x86_64.exe" -OutFile "C:\RustDesk\rustdesk.exe"

      - name: Set Password and Run RustDesk
        run: |
          $rustdesk = "C:\RustDesk\rustdesk.exe"
          Start-Process -FilePath $rustdesk -WindowStyle Normal
          Start-Sleep -Seconds 10
          & $rustdesk --password "admin@123"

      - name: Take Screenshot
        run: |
          Start-Sleep -Seconds 3
          
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bitmap = New-Object System.Drawing.Bitmap $screen.Bounds.Width, $screen.Bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.Bounds.X, $screen.Bounds.Y, 0, 0, $bitmap.Size)
          $bitmap.Save("C:\RustDesk\screenshot.png")
          $graphics.Dispose()
          $bitmap.Dispose()
          
          Write-Host "Screenshot saved!"

      - name: Upload Screenshot
        run: |
          $imgPath = "C:\RustDesk\screenshot.png"
          
          if (Test-Path $imgPath) {
              Write-Host "Uploading screenshot..."
              $response = Invoke-RestMethod -Uri "https://0x0.st" -Method Post -InFile $imgPath -ContentType "multipart/form-data"
              Write-Host "========================================="
              Write-Host "SCREENSHOT URL: $response"
              Write-Host "========================================="
              echo "SCREENSHOT_URL=$response" >> $env:GITHUB_ENV
          } else {
              Write-Host "Screenshot not found!"
          }

      - name: Display Info
        run: |
          Write-Host "========================================="
          Write-Host "RustDesk Password: admin@123"
          Write-Host "Windows User: TOOLBOXLAP"
          Write-Host "Windows Password: admin@123"
          Write-Host "Screenshot: $env:SCREENSHOT_URL"
          Write-Host "========================================="

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Active | Screenshot: $env:SCREENSHOT_URL"
              Start-Sleep -Seconds 300
          }
