name: disercore

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Ownership Verification
        run: |
          $encodedNotice = ""
          $decodedNotice = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($encodedNotice))
          Write-Host $decodedNotice
          if (-not $decodedNotice -or $decodedNotice -notlike "*ToolboxLap.xyz*") {
              Write-Error "Copyright was tampered with or removed – script will not work!"
              exit 1
          }

      - name: Create Folder
        run: |
          $folderPath = "D:\link subscribe youtube channel"
          if (-Not (Test-Path -Path $folderPath)) {
              New-Item -Path $folderPath -ItemType Directory
              Write-Host "Folder created in D drive."
          }

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create User
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "TOOLBOXLAP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "TOOLBOXLAP"

      - name: Download RustDesk
        run: |
          $rdUrl = "https://github.com/rustdesk/rustdesk/releases/download/1.2.7/rustdesk-1.2.7-x86_64.exe"
          $installerPath = "$env:TEMP\rustdesk.exe"
          Invoke-WebRequest -Uri $rdUrl -OutFile $installerPath

      - name: Install and Run RustDesk
        run: |
          $installerPath = "$env:TEMP\rustdesk.exe"
          Start-Process -FilePath $installerPath -ArgumentList "--silent-install" -Wait
          
          Start-Sleep -Seconds 5
          
          $rustdeskPath = "$env:ProgramFiles\RustDesk\rustdesk.exe"
          if (Test-Path $rustdeskPath) {
              Start-Process -FilePath $rustdeskPath -ArgumentList "--service" -WindowStyle Hidden
              Start-Sleep -Seconds 3
          } else {
              Write-Error "RustDesk installation failed"
              exit 1
          }

      - name: Get RustDesk ID and Password
        run: |
          $rustdeskPath = "$env:ProgramFiles\RustDesk\rustdesk.exe"
          
          $rdId = & $rustdeskPath --get-id
          $rdPass = & $rustdeskPath --password
          
          echo "RUSTDESK_ID=$rdId" >> $env:GITHUB_ENV
          echo "RUSTDESK_PASS=$rdPass" >> $env:GITHUB_ENV
          
          Write-Host "RustDesk ID: $rdId"
          Write-Host "RustDesk Password: $rdPass"

      - name: Display Connection Info
        run: |
          Write-Host ""
          Write-Host "=== RUSTDESK ACCESS ==="
          Write-Host "RustDesk ID: $env:RUSTDESK_ID"
          Write-Host "RustDesk Password: $env:RUSTDESK_PASS"
          Write-Host "Windows User: TOOLBOXLAP"
          Write-Host "Windows Password: admin@123"
          Write-Host "Powered by https://www.toolboxlap.xyz/"
          Write-Host "========================="
          Write-Host ""

      - name: Maintain Connection
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Session Active | RustDesk ID: $env:RUSTDESK_ID"
              Start-Sleep -Seconds 300
          }
