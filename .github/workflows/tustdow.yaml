name: disercore

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Create User
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "TOOLBOXLAP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"

      - name: Download Portable RustDesk
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.7/rustdesk-1.2.7-x86_64.exe"
          New-Item -Path "C:\RustDesk" -ItemType Directory -Force
          Invoke-WebRequest -Uri $url -OutFile "C:\RustDesk\rustdesk.exe"

      - name: Run RustDesk
        run: |
          Start-Process -FilePath "C:\RustDesk\rustdesk.exe" -WindowStyle Hidden
          Start-Sleep -Seconds 10

      - name: Get RustDesk Info from Config
        run: |
          Start-Sleep -Seconds 5
          
          # البحث عن ملف الإعدادات
          $configPath = Get-ChildItem -Path "C:\Users\runneradmin\AppData\Roaming\RustDesk\config" -Filter "*.toml" -ErrorAction SilentlyContinue | Select-Object -First 1
          
          if ($configPath) {
              Write-Host "Config found!"
              Get-Content $configPath.FullName
          } else {
              Write-Host "Config not found, trying alternative method..."
              
              # محاولة الحصول على ID من السجلات
              $logPath = "C:\Users\runneradmin\AppData\Roaming\RustDesk\log"
              if (Test-Path $logPath) {
                  Get-ChildItem $logPath | Get-Content -Tail 50
              }
          }

      - name: Display Info
        run: |
          Write-Host "========================================="
          Write-Host "RustDesk is running!"
          Write-Host "Check the logs above for ID/Password"
          Write-Host "Windows User: TOOLBOXLAP"
          Write-Host "Windows Password: admin@123"
          Write-Host "========================================="

      - name: Get RustDesk ID Manually
        run: |
          # محاولة قراءة ID من السجل
          $rustdeskPath = "C:\RustDesk\rustdesk.exe"
          
          # كتابة ID لملف
          & $rustdeskPath --get-id 2>&1 | Out-File -FilePath "C:\RustDesk\id.txt" -Force
          & $rustdeskPath --password 2>&1 | Out-File -FilePath "C:\RustDesk\pass.txt" -Force
          
          Write-Host "=== Reading RustDesk Files ==="
          if (Test-Path "C:\RustDesk\id.txt") {
              $id = Get-Content "C:\RustDesk\id.txt"
              Write-Host "ID: $id"
              echo "RUSTDESK_ID=$id" >> $env:GITHUB_ENV
          }
          if (Test-Path "C:\RustDesk\pass.txt") {
              $pass = Get-Content "C:\RustDesk\pass.txt"
              Write-Host "Password: $pass"
              echo "RUSTDESK_PASS=$pass" >> $env:GITHUB_ENV
          }
          
          # البحث في مجلد AppData
          Write-Host "=== Searching AppData ==="
          Get-ChildItem "C:\Users\runneradmin\AppData\Roaming\RustDesk" -Recurse -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RustDesk Active"
              Start-Sleep -Seconds 300
          }
