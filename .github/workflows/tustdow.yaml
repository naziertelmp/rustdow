name: TigerVNC Cloudflare

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Create User
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "TOOLBOXLAP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"

      - name: Download TigerVNC
        run: |
          Invoke-WebRequest -Uri "https://sourceforge.net/projects/tigervnc/files/stable/1.13.1/tigervnc64-1.13.1.exe" -OutFile "C:\tigervnc.exe"

      - name: Install TigerVNC
        run: |
          Start-Process -FilePath "C:\tigervnc.exe" -ArgumentList "/VERYSILENT" -Wait
          Start-Sleep -Seconds 10

      - name: Start VNC Server
        run: |
          Set-Location "C:\Program Files\TigerVNC"
          Start-Process -FilePath ".\winvnc.exe" -WindowStyle Hidden
          Start-Sleep -Seconds 5

      - name: Download Cloudflared
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "C:\cloudflared.exe"

      - name: Start Tunnel
        run: |
          Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:5900" -NoNewWindow -RedirectStandardOutput "C:\tunnel.txt" -RedirectStandardError "C:\tunnel-error.txt"
          Start-Sleep -Seconds 15
          
          Write-Host "Waiting for tunnel..."
          Start-Sleep -Seconds 10
          
          $tunnelOutput = Get-Content "C:\tunnel.txt" -Raw
          $tunnelError = Get-Content "C:\tunnel-error.txt" -Raw
          
          Write-Host "=== Tunnel Output ==="
          Write-Host $tunnelOutput
          Write-Host $tunnelError
          
          # البحث عن الرابط
          if ($tunnelError -match '(https?://[^\s]+trycloudflare\.com[^\s]*)') {
              $url = $matches[1] -replace 'https://', ''
              Write-Host "========================================="
              Write-Host "VNC Address: $url"
              Write-Host "VNC Password: admin@123"
              Write-Host "========================================="
              echo "VNC_URL=$url" >> $env:GITHUB_ENV
          }

      - name: Display Info
        run: |
          Write-Host "========================================="
          Write-Host "VNC Password: admin@123"
          Write-Host "Windows User: TOOLBOXLAP"  
          Write-Host "Windows Password: admin@123"
          Write-Host "========================================="

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] VNC Active | Pass: admin@123"
              Start-Sleep -Seconds 300
          }
