name: disercore RustDesk

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Create User
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "TOOLBOXLAP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"

      - name: Download RustDesk
        run: |
          New-Item -Path "C:\RustDesk" -ItemType Directory -Force
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.7/rustdesk-1.2.7-x86_64.exe" -OutFile "C:\RustDesk\rustdesk.exe"

      - name: Set RustDesk Password
        run: |
          # we
          & "C:\RustDesk\rustdesk.exe" --password "admin@123"
          Start-Sleep -Seconds 3

      - name: Run RustDesk
        run: |
          Start-Process -FilePath "C:\RustDesk\rustdesk.exe" -WindowStyle Hidden
          Start-Sleep -Seconds 10

      - name: Get RustDesk ID
        run: |
          # d ID s
          & "C:\RustDesk\rustdesk.exe" --get-id > "C:\RustDesk\id_output.txt" 2>&1
          Start-Sleep -Seconds 2
          
          $output = Get-Content "C:\RustDesk\id_output.txt" -Raw
          $id = ($output -split '\n' | Select-Object -Last 1).Trim()
          
          Write-Host "========================================="
          Write-Host "RustDesk ID: $id"
          Write-Host "RustDesk Password: admin@123"
          Write-Host "Windows User: TOOLBOXLAP"
          Write-Host "Windows Password: admin@123"
          Write-Host "========================================="
          echo "RUSTDESK_ID=$id" >> $env:GITHUB_ENV

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] ID: $env:RUSTDESK_ID | Pass: admin@123"
              Start-Sleep -Seconds 300
          }
