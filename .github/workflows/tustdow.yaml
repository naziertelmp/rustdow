name: disercore

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Ownership Verification
        run: |
          $encodedNotice = ""
          $decodedNotice = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String($encodedNotice))
          Write-Host $decodedNotice

      - name: Create User
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "TOOLBOXLAP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"

      - name: Download RustDesk
        run: |
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.2.7/rustdesk-1.2.7-x86_64.exe" -OutFile "$env:TEMP\rustdesk.exe"

      - name: Install RustDesk
        run: |
          Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "--silent-install" -Wait
          Start-Sleep -Seconds 15

      - name: Find and Run RustDesk
        run: |
          $rustdeskPath = Get-ChildItem -Path "C:\Users\runneradmin\AppData" -Recurse -Filter "rustdesk.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          
          if (-not $rustdeskPath) {
              $rustdeskPath = Get-ChildItem -Path "C:\Program Files\RustDesk" -Recurse -Filter "rustdesk.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          
          if ($rustdeskPath) {
              Write-Host "Found: $rustdeskPath"
              Start-Process -FilePath $rustdeskPath -ArgumentList "--service" -WindowStyle Hidden
              Start-Sleep -Seconds 5
              $rdId = & $rustdeskPath --get-id
              $rdPass = & $rustdeskPath --password
              Write-Host "========================================="
              Write-Host "RustDesk ID: $rdId"
              Write-Host "RustDesk Password: $rdPass"
              Write-Host "========================================="
              echo "RUSTDESK_ID=$rdId" >> $env:GITHUB_ENV
              echo "RUSTDESK_PASS=$rdPass" >> $env:GITHUB_ENV
          } else {
              Write-Error "RustDesk not found!"
              exit 1
          }

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Active | ID: $env:RUSTDESK_ID"
              Start-Sleep -Seconds 300
          }
