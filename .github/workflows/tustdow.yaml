name: disercore

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Create User
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "TOOLBOXLAP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"

      - name: Download Portable RustDesk
        run: |
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.2.7/rustdesk-1.2.7-x86_64.exe"
          $dest = "C:\RustDesk\rustdesk.exe"
          New-Item -Path "C:\RustDesk" -ItemType Directory -Force
          Invoke-WebRequest -Uri $url -OutFile $dest

      - name: Run RustDesk and Get ID
        run: |
          $rustdeskPath = "C:\RustDesk\rustdesk.exe"
          
          Start-Process -FilePath $rustdeskPath -WindowStyle Hidden
          Start-Sleep -Seconds 10
          
          $rdId = & $rustdeskPath --get-id
          $rdPass = & $rustdeskPath --password
          
          echo "RUSTDESK_ID=$rdId" >> $env:GITHUB_ENV
          echo "RUSTDESK_PASS=$rdPass" >> $env:GITHUB_ENV
          
          Write-Host "========================================="
          Write-Host "RustDesk ID: $rdId"
          Write-Host "RustDesk Password: $rdPass"
          Write-Host "========================================="

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Active | ID: $env:RUSTDESK_ID | Pass: $env:RUSTDESK_PASS"
              Start-Sleep -Seconds 300
          }
