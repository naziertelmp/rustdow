name: DWService Windows

on:
  workflow_dispatch:

jobs:
  secure:
    runs-on: windows-2025
    timeout-minutes: 3600
    
    steps:
      - name: Create User
        run: |
          $password = "admin@123"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name "TOOLBOXLAP" -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name "TOOLBOXLAP" -Password $securePass -AccountNeverExpires
          }
          Add-LocalGroupMember -Group "Administrators" -Member "TOOLBOXLAP"

      - name: Download DWService
        run: |
          Invoke-WebRequest -Uri "https://www.dwservice.net/download/dwagent.exe" -OutFile "C:\dwagent.exe"

      - name: Install DWService
        run: |
          Start-Process -FilePath "C:\dwagent.exe" -ArgumentList "install" -Wait
          Start-Sleep -Seconds 10

      - name: Take Screenshot of DWService
        run: |
          Start-Sleep -Seconds 5
          
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $bitmap = New-Object System.Drawing.Bitmap $screen.Bounds.Width, $screen.Bounds.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.Bounds.X, $screen.Bounds.Y, 0, 0, $bitmap.Size)
          $bitmap.Save("C:\screenshot.png")
          $graphics.Dispose()
          $bitmap.Dispose()
          
          Write-Host "✅ Screenshot saved!"

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: DWService-Screenshot
          path: C:\screenshot.png

      - name: Display Info
        run: |
          Write-Host "========================================="
          Write-Host "  ✅ DWService is Running!"
          Write-Host "========================================="
          Write-Host "  👤 Windows User: TOOLBOXLAP"
          Write-Host "  🔒 Windows Password: admin@123"
          Write-Host "========================================="
          Write-Host "  📸 Download screenshot from Artifacts"
          Write-Host "  📸 to see DWService Agent ID/Code!"
          Write-Host "========================================="

      - name: Keep Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] DWService Active"
              Start-Sleep -Seconds 300
          }
